<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таберик & Таңнуру — Үйлөнүү тоюбузга чакырабыз!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --burgundy-deep: #2b080e;
      --burgundy-main: #4a0e17;
      --emerald-dark: #092017;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --ivory: #fdfbf7;
      --warm-beige: #f5efe6;
      --text-gold: #e6c675;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--burgundy-deep);
      color: var(--ivory);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }
    .wrapper { max-width: 600px; margin: 0 auto; background: var(--burgundy-main); position: relative; }
    .hero { text-align: center; padding: 40px 20px; border-bottom: 2px solid var(--gold-primary); }
    h1 { font-family: 'Cormorant Garamond', serif; color: var(--gold-light); font-size: 2.5rem; margin-bottom: 10px; }
    .subtitle { font-family: 'Great Vibes', cursive; font-size: 2rem; color: var(--gold-primary); }
    .btn { background: var(--gold-gradient); color: #000; padding: 12px 24px; border: none; font-weight: bold; border-radius: 25px; cursor: pointer; margin: 10px; }
    .details { padding: 30px 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hero">
      <div class="subtitle">Үйлөнүү тоюбузга чакырабыз!</div>
      <h1>ТАБЕРИК & ТАҢНУРУ</h1>
      <p>17 ОКТЯБРЬ 2026</p>
    </div>
    <div class="details">
      <h2>Үч Султан</h2>
      <p>Той ээлери: Таалайбек & Бүбүсайра</p>
      <button class="btn" onclick="alert('Рахмат! Сиздин катышууңуз катталды.')">Мен сөзсүз барам</button>
      <button class="btn" onclick="alert('Кабарлаганыңызга рахмат!')">Тилекке каршы бара албайм</button>
    </div>
  </div>
</body>
</html>
